[common]
# frps 服务端公网 IP 或域名，不带 http:// 或 https://
server_addr = 替换为你的服务器IP或域名

# frps 服务端监听端口，按实际配置修改
server_port = 7000

# 与 frps 服务端配置的 Token 一致
token = 替换为你的FRP_TOKEN

# 首次连接失败后继续重试
login_fail_exit = false

# 日志输出到控制台
log_file = console
log_level = info

[my-web-4567]
type = tcp

# 同一个 Compose 项目中的服务名
local_ip = my_web
local_port = 4567

# 公网服务器对外提供访问的端口
remote_port = 4567